# Bilimora — reverse proxy + SSL termination
# Кладётся в /etc/nginx/conf.d/bilimora.conf на andrey-claude-uz
# Перед активацией: sudo certbot --nginx -d bilimora.uz -d www.bilimora.uz

# ─── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bilimora.uz www.bilimora.uz;

    # ACME challenge от Let's Encrypt (certbot renew)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bilimora.uz www.bilimora.uz;

    # SSL (certbot-managed, обновляется через certbot.timer)
    ssl_certificate /etc/letsencrypt/live/bilimora.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilimora.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bilimora.uz/chain.pem;

    # Современные настройки (Mozilla Intermediate, август 2026)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 1 год, subdomains включены
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy — defense in depth для рекламных платформ + XSS.
    # Разрешаем то, что реально нужно: Next.js inline + Meta/GA4/Yandex + Supabase realtime (wss).
    # 'unsafe-inline' / 'unsafe-eval' для скриптов — Next.js bootstrap генерит inline.
    # Если что-то сломается — смягчить первым делом: убрать 'unsafe-eval', потом nonce-based CSP через middleware.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net https://www.googletagmanager.com https://mc.yandex.ru https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://connect.facebook.net https://www.google-analytics.com https://mc.yandex.ru https://*.supabase.co wss://*.supabase.co; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none';" always;

    # Логи
    access_log /var/log/nginx/bilimora.access.log;
    error_log /var/log/nginx/bilimora.error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ─── Reverse proxy на Next.js standalone ─────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Таймауты — Next.js SSR может думать долго
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket support (если будет чат / live-уроки)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Статика Next.js — отдавать напрямую, минуя Node ────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static/ {
        alias /opt/bilimora/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Лимиты для upload
    client_max_body_size 25M;
}
